<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anfal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f5f0;
    --ink:#2e2e2c;
    --dim:#6e6d69;
    --accent:#5f9b65;
    --accent-deep:#4a7c50;
    --rule:#e2dfd7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1c1a;
      --ink:#e6e3dc;
      --dim:#9b9992;
      --accent:#7fb886;
      --accent-deep:#9ccfa2;
      --rule:#333330;
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
    font-size:17px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(28px,7vw,80px);
  }

  main{width:100%; max-width:520px}

  h1{
    margin:0 0 6px;
    font-size:clamp(40px,8vw,72px);
    line-height:1.05;
    font-weight:600;
    letter-spacing:-.015em;
  }

  .sub{
    margin:0 0 clamp(26px,4vw,36px);
    color:var(--dim);
    font-size:17px;
    font-style:italic;
  }

  hr{
    border:0;
    border-top:1px solid var(--rule);
    margin:0 0 clamp(22px,3vw,28px);
  }

  nav{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px clamp(18px,3.5vw,32px);
  }

  nav a{
    display:inline-flex;
    align-items:center;
    gap:11px;
    width:fit-content;
    text-decoration:none;
    color:var(--accent);
    font-size:17px;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav a svg{
    width:16px; height:16px;
    stroke:currentColor; fill:none;
    stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;
    flex:none; opacity:.85;
  }
  nav a:hover,nav a:focus-visible{
    color:var(--accent-deep);
    border-bottom-color:currentColor;
  }
  nav a:focus-visible{outline:2px solid var(--accent); outline-offset:4px; border-radius:2px}

  @media (prefers-reduced-motion:reduce){ nav a{transition:none} }
</style>
</head>
<body>
  <main>
    <h1>Anfal Bourouina</h1>
    <p class="sub">{Building, Breaking, Securing} agents.</p>
    <hr>
    <nav>
      <a href="resume.pdf">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
        Resume
      </a>
      <a href="https://github.com/anii76">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M6.5 8v8"/><path d="M17.5 11.5c0 3-3 4-6 4.5"/></svg>
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/anfal-bourouina">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M8 11v5.5"/><circle cx="8" cy="7.9" r=".9" fill="currentColor" stroke="none"/><path d="M12 16.5V12a2 2 0 0 1 4 0v4.5"/></svg>
        LinkedIn
      </a>
      <a href="mailto:anfal@email.com">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
        Email
      </a>
    </nav>
  </main>
</body>
</html>
